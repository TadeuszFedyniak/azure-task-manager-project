{% extends "base.html" %}{% block content %}
<section class="panel narrow"><h1>Logowanie</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<label>Nazwa użytkownika<input name="username" minlength="3" maxlength="80" required autocomplete="username"></label>
<label>Hasło<input name="password" type="password" required autocomplete="current-password"></label>
<button type="submit">Zaloguj</button></form>
<p>Nie masz konta? <a href="/register">Zarejestruj się</a></p></section>
{% endblock %}
